<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dự Báo Mưa Đà Nẵng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f0f4f8; }
        .navbar { background: linear-gradient(135deg, #1e3a5f, #2980b9); }
        .card { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .btn-primary { background: linear-gradient(135deg, #2980b9, #1e3a5f); border: none; }
        .btn-success { background: linear-gradient(135deg, #27ae60, #1e8449); border: none; }
        .result-rain { background: linear-gradient(135deg, #2980b9, #1565c0); color: white; border-radius: 16px; }
        .result-no-rain { background: linear-gradient(135deg, #f39c12, #e67e22); color: white; border-radius: 16px; }
        .prob-bar { height: 12px; border-radius: 6px; transition: width 0.8s ease; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark px-4 py-3">
        <span class="navbar-brand fw-bold fs-5">
            <i class="fas fa-cloud-rain me-2"></i>Dự Báo Mưa Đà Nẵng
        </span>
        <span class="text-white-50 small">
            <i class="fas fa-map-marker-alt me-1"></i>16.07°N, 108.22°E
        </span>
    </nav>

    <div class="container py-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
